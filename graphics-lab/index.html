  <style>
    :root { --bg: #F3F4F6; --surface: #FFFFFF; --ink: #22262E; --muted: #636B78; --line: #E2E4EA; --accent: #4B5BD7; --accent-soft: rgba(75, 91, 215, 0.10); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #14161B; --surface: #1C1F26; --ink: #E8EAF0; --muted: #98A0AE; --line: #2B2F3A; --accent: #93A0FF; --accent-soft: rgba(147, 160, 255, 0.12); }
    }
    :root[data-theme="dark"] { --bg: #14161B; --surface: #1C1F26; --ink: #E8EAF0; --muted: #98A0AE; --line: #2B2F3A; --accent: #93A0FF; --accent-soft: rgba(147, 160, 255, 0.12); }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { max-width: 64rem; margin: 0 auto; padding: 20px 16px 60px; }
  </style>
  <link rel="stylesheet" href="styles/app.css" />
